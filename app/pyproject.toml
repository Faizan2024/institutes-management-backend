[project]
name = "institute-management-backend"
version = "0.1.0"
description = "Institute Management System Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "pymysql",
    "pwdlib[argon2]",
    "PyJWT",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"